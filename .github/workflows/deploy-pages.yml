name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
        env:
          # Pages는 https://<org>.github.io/<repo>/ 하위에 서빙된다.
          VITE_BASE: /${{ github.event.repository.name }}/
          # 정적 호스팅에는 dev 프록시가 없으므로 관제서버 절대주소가 필요하다.
          # 저장소 Variables에 API_BASE_URL(https, CORS 허용)을 넣으면 그 값을 쓴다.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
